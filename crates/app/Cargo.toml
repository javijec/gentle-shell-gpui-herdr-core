[package]
name = "gentle-shell-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gentle-shell-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64 = "0.23"
dunce = "1"
# Device previews: PNG decoding for iOS screenshots and raw-frame construction;
# pasted BMP (Windows' Snipping Tool) and TIFF images are re-encoded as PNG.
# Theme pictures (jpg, png, webp) are decoded for their effects.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff", "jpeg", "webp"] }
serde.workspace = true
serde_json.workspace = true
gentle-core = { path = "../core" }
pi-rpc = { path = "../pi-rpc" }
gpui-kit = { version = "0.9.0", features = ["syntect"] }
smol = "2"
dirs = "7"
regex.workspace = true
sha2 = "0.11"
alacritty_terminal = "0.26"
ignore = "0.4"
ureq = "3"
trash = "5"
# Self-update: release archives (macOS/Windows zip, Linux tar.gz).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"
# Mermaid diagrams in the Markdown preview: the app finds the system sans
# font (fontdb) that merman's CLI, downloaded on demand, measures text with;
# its macOS and Linux builds come as .tar.xz (lzma-rs).
fontdb = "0.23"
lzma-rs = "0.3"
rquickjs = "0.14.0"
# Theme scene previews for agents: a frame's shapes as SVG, rasterized to PNG
# (the same resvg GPUI draws icons with).
resvg = { version = "0.46", default-features = false, features = ["text", "raster-images"] }
# A theme image's size without decoding it, for the camera over it.
imagesize = "0.15"

# UI tests drive real views in headless windows (GPUI's `TestAppContext`):
# the generative UI diagram's and panels' pointer and keyboard. Only GPUI's
# own `test-support`: the Kit's also names its optional `gpui-fast` backend,
# whose pinned dependencies Cargo would then resolve into the lockfile.
[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

# The X11 window icon (GPUI's `WindowOptions::icon`), and the in-app browser
# for the Gentle Design canvas: WebKitGTK as a child of the X11 window (GTK's
# loop is pumped while it is open; Wayland has no child windows).
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview", "x11"] }
gtk = "0.18"
raw-window-handle = "0.6"

# The in-app browser on Windows: WebView2 in a popup owned by the window (GPUI
# composites above child windows), rounded by DWM on Windows 11.
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }

# The Dock icon when the binary runs outside its `.app` (`cargo run`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSProcessInfo: Low Power Mode, so animated themes can rest (platform::power).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSView", "NSWindow", "objc2-quartz-core"] }
# The in-app browser for the Gentle Design canvas (WKWebView as a child view),
# and its layer, rounded to the card's corners.
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }

# Embeds the exe icon and version info (see build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
