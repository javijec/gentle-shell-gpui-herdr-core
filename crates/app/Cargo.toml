[package]
name = "gentle-shell-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gentle-shell-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64 = "0.22"
dunce = "1"
# Device previews: PNG decoding for iOS screenshots and raw-frame construction.
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
gentle-core = { path = "../core" }
pi-rpc = { path = "../pi-rpc" }
herdr-client = { path = "../herdr-client" }
gpui-kit = { version = "0.9.0", features = ["syntect"] }
smol = "2"
dirs = "7"
regex.workspace = true
sha2 = "0.10"
alacritty_terminal = "0.26"
ignore = "0.4"
ureq = "3"
trash = "5"
# Self-update: release archives (macOS/Windows zip, Linux tar.gz).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"

# The X11 window icon (GPUI's `WindowOptions::icon`), and the in-app browser
# for the Gentle Design canvas: WebKitGTK as a child of the X11 window (GTK's
# loop is pumped while it is open; Wayland has no child windows).
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview", "x11"] }
gtk = "0.18"
raw-window-handle = "0.6"

# The in-app browser on Windows: WebView2 in a popup owned by the window (GPUI
# composites above child windows), rounded by DWM on Windows 11.
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# The Dock icon when the binary runs outside its `.app` (`cargo run`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSView", "NSWindow", "objc2-quartz-core"] }
# The in-app browser for the Gentle Design canvas (WKWebView as a child view),
# and its layer, rounded to the card's corners.
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }

# Embeds the exe icon and version info (see build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
