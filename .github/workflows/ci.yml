name: CI

# Tests and lints only. Release builds, packaging and assets belong to
# release.yml (on `v*` tags), so CI never repeats that work.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "packaging/icons/**"]
  pull_request:
    paths-ignore: ["**.md", "packaging/icons/**"]

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Ubuntu's mirror for GitHub runners can crawl (65 MB took over 10 minutes),
      # so the downloaded .debs are cached and only fetched once per image.
      - name: Restore apt packages
        if: runner.os == 'Linux'
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.arch }}-${{ env.ImageOS }}-v1
      - name: Linux system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          APT="sudo apt-get -o Acquire::Retries=3 -o Dir::Cache::Archives=$HOME/apt-archives"
          $APT update
          $APT install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev
          sudo chown -R "$USER" ~/apt-archives
      - name: Save apt packages
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.arch }}-${{ env.ImageOS }}-v1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Remote Herdr bridge regression tests
        run: node --test crates/pi-rpc/tests/herdr_remote_bridge.test.cjs
