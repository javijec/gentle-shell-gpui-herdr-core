[workspace]
resolver = "2"
members = ["crates/core", "crates/pi-rpc", "crates/app", "crates/herdr-client"]

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-channel = "2.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# `cargo run --release` stays Cargo's default (parallel codegen, no LTO) so
# local optimized builds are quick. Published packages use `--profile dist`:
# whole-program optimization, one codegen unit and no symbols, which makes
# the binary about a third smaller at the cost of a much slower build.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
